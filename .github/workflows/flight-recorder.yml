name: Metric Atlas Flight Recorder

on:
  schedule:
    # GitHub schedules are best effort and can be delayed.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metric-atlas-flight-recorder
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Read previous archive
        run: |
          git fetch origin refs/heads/flight-data:refs/remotes/origin/flight-data --depth=1
          git show origin/flight-data:data/flight-recorder.json > /tmp/metric-flight-previous.json
          cp /tmp/metric-flight-previous.json /tmp/metric-flight-next.json
      - name: Collect complete metadata and sampled quotes
        run: |
          day="$(date -u +%Y-%m-%d)"
          if ! git show "origin/flight-data:data/events/${day}.json" > /tmp/metric-flight-day.json 2>/dev/null; then
            printf '{"date":"%s","events":[]}\n' "$day" > /tmp/metric-flight-day.json
          fi
          python3 scripts/collect_flight.py \
            --previous /tmp/metric-flight-previous.json \
            --output /tmp/metric-flight-next.json \
            --daily-output /tmp/metric-flight-day.json
      - name: Publish archive
        run: |
          day="$(date -u +%Y-%m-%d)"
          git switch -c flight-data --track origin/flight-data
          mkdir -p data/events
          cp /tmp/metric-flight-next.json data/flight-recorder.json
          cp /tmp/metric-flight-day.json "data/events/${day}.json"
          git add data/flight-recorder.json "data/events/${day}.json"
          git -c user.name='Metric Atlas Flight Recorder' \
              -c user.email='actions@users.noreply.github.com' \
              commit -m "Record Metric pool observations ${day}" || exit 0
          git push origin HEAD:flight-data
